<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Inventory</title><style>
:root{font:16px/1.5 system-ui;color:#142d28;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}header{background:#143d35;color:white;padding:18px max(5vw,20px);display:flex;align-items:center;gap:18px}header b{font-size:21px}header span{margin-left:auto}main,nav{width:min(1120px,92%);margin:auto}nav{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid #d0d9cf}button{font:inherit;font-weight:600;cursor:pointer;background:#215f50;color:white;border:0;border-radius:6px;padding:8px 16px}button:disabled{opacity:.6}nav button,button.alt{background:#e1ebe3;color:#184838}nav button[aria-current=true]{background:#215f50;color:white}h1{font-size:clamp(30px,5vw,44px);line-height:1.1;letter-spacing:-.04em}h2{font-size:21px}section,details{padding:22px;background:white;border:1px solid #d5ded5;border-radius:12px;margin:14px 0}section h2{margin-top:0}form{display:flex;align-items:end;flex-wrap:wrap;gap:12px}label{display:grid;font-size:14px;font-weight:600;gap:4px}input,select{font:inherit;padding:9px;border:1px solid #96a99e;border-radius:5px;max-width:100%}summary{cursor:pointer;font-weight:700}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e1e7de}th{color:#4d6559}td button{margin:2px;padding:5px 10px;font-size:14px}.login{max-width:400px;margin:10vh auto}.login form,.login label{display:grid;width:100%}.alert{border-left:5px solid #b78226}#mensaje:not(:empty){background:#fff3d8;padding:12px;border-radius:6px}dialog{border:1px solid #aaa;border-radius:10px;max-width:90vw}dialog::backdrop{background:#15352d80}[hidden]{display:none!important}
</style><header><b>Smart Inventory</b><span id="identidad"></span><button hidden class="alt" id="salir">Salir</button></header><nav hidden aria-label="Navegación"></nav><main><p role="status" id="mensaje"></p><div id="vista"></div></main><dialog id="modal"><h2 id="modalTitulo"></h2><div id="modalBody"></div><p role="status" id="modalError"></p><button class="alt" id="cerrar">Cancelar</button></dialog><script src="app.js" defer></script></html>
